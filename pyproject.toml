[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tebdil"
version = "0.1.0"
description = "TEBDIL: Cooperative Latent Excursions for Recurrent Reasoning"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.4.0",
    "transformers==4.55.0",
    "safetensors>=0.4.5",
    "huggingface-hub>=0.25.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "pydantic>=2.8.0",
    "pyyaml>=6.0.1",
    "psutil>=6.0.0",
    "plotly>=5.24.0",
    "streamlit>=1.39.0",
    "pytest>=8.3.0",
]

[project.scripts]
tebdil = "tebdil.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tebdil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_model: tests requiring downloaded Ouro checkpoint weights",
]
